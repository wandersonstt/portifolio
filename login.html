<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teste</title>
    
    <link rel="stylesheet" href="css\login.css"/>
  </head>
  <body>
    <main>
      <div  class="container">
        <form>
            <h1 class="topo">LOGIN</h1>
          <h2>E-mail</h2>
          <div class="box">
            <input id="email" type="email" placeholder="seu email" />
          </div>

          <h2>Senha</h2>
          <div class="box">
            <input id="password" type="password" placeholder="sua senha" />
          </div>
          <div class="lembra-senha">
            <label>
              <input  type="checkbox"/>
              Lembra minha senha
            </label>
            <a class="esqueci" href="#"> Esqueci minha senha</a>
          </div>

          <button id="entrar" type="submit">Login</button>

          <di class="cadastra-link"> 
            <p> Não tem conta ? <a href="#">Cadastre-se</a></p>
          </div>



        </form>

        
      </div>
    </main>
  
  <script src="js\login.js"></script>
  </body>

  
</html>
